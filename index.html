<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0812" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vesper" />
    <title>Vesper</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-180.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="preload" href="fonts/VT323-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <!-- écran de chargement : ses styles sont ici pour s'afficher avant tout le reste -->
    <style>
      #boot {
        --p: 0;
        --glow: #ff8a3d;
        --sky: rgba(255, 138, 61, 0.13);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 55% at 50% 100%, var(--sky), transparent 70%),
          #0b0812;
        color: #f3e6c8;
        font-family: 'VT323', ui-monospace, 'Courier New', monospace;
        transition: opacity 0.55s ease;
        -webkit-user-select: none;
        user-select: none;
      }
      #boot.az { --glow: #5ff0e0; --sky: rgba(95, 240, 224, 0.12); }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .stars { position: absolute; inset: 0; overflow: hidden; }
      #boot .stars i {
        position: absolute; width: 2px; height: 2px; background: #f3e6c8;
        animation: boot-twinkle 2.4s steps(2) infinite;
      }
      #boot .stage { width: 100%; display: grid; justify-items: center; gap: 0; }
      #boot .name { margin: 0 0 104px; font-size: 40px; letter-spacing: 0.42em; padding-left: 0.42em; opacity: 0.92; }
      #boot .path { position: relative; width: min(260px, 72vw); height: 4px; background: #261d33; }
      #boot .lit {
        position: absolute; left: 0; top: 0; bottom: 0;
        width: calc(var(--p) * 100%);
        background: var(--glow);
        box-shadow: 0 0 10px var(--glow);
        transition: width 0.6s cubic-bezier(0.3, 0.7, 0.4, 1);
      }
      #boot .dog {
        position: absolute; bottom: -6px;
        left: calc(var(--p) * (100% - 80px));
        width: 80px; height: 80px;
        background: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAQCAYAAACm53kpAAACRUlEQVR4AcyWsUpDQRBF17QWKtipWNiJNjaWgna2+hP+gIJgZSEWFlZBy5RiaSdYCBYRMYVJKSikFNQviHsmmefk5e1mkwhR3tmZnb13NzsmISWX+Dc7Pd8C5EQgTwU9oCcCeSroAT0RyFNBD+iJQJ7cgL2DI/SCzaWQMFiPzROsIrEem8tiwmA9Nk9qAN0qnx7LMTaXQsJgPTZPsIrEemwuiwmD9dgca1IDEFbrL85CbRCsl3wQL1o8FmqDYL3k6k1uwFOt4WBybloiG9BNYgp44b/5kxugl9z/bme2i6/Nz1a72n8s8vd3/SqK/KOc39MA/qut2nYLqufLEjm+Xm84WCxfSlxfWaUs2HwYv2zSGYbxj3J+ie5xKOdrfLx/c0CNeL226LZuKxn6hfjx1ZxAQ8QLzPGA5jH/uM8vLc3PTOgFeMG8tWd3HpxloXLjYONsyu0+vzv0gF7R+aD+cZ+ffQT0AnxRhbhqHup9gzHkpR7zj+v8rAF6Iz7nMVQXijEva/iOTi6CX5poYuCPEfOylvf2NIDPdww2iF0g5mUNfww0MfCOer71dzVA34b6U5FIDTiYOTGE6nQdPTWgxpzIBYl58jr01AAtc2KIIh01CHm6GqAifYEa+9V1nchhQF7kZw1YD6E+jarTuUat5yPrnAG6Rg7MWSdCvgGbXrRl8aJNsDVyXyt6ROsXsn3IAQ+Qd/Ch58l8aMErZE9yi68XPZnfL4ovH3UPX5cn34A7qfYfQrpQPb9jSBeq/5m/s1F2zg8AAAD//3ZlSLoAAAAGSURBVAMAmu4yljP/9QQAAAAASUVORK5CYII=) 0 0 / 320px 80px no-repeat;
        image-rendering: pixelated;
        animation: boot-trot 0.5s steps(4) infinite;
        transition: left 0.6s cubic-bezier(0.3, 0.7, 0.4, 1);
      }
      #boot .line { margin: 26px 0 0; min-height: 1.2em; padding: 0 16px; font-size: 19px; color: #8b7f99; text-align: center; }
      #boot .retry { display: none; margin-top: 10px; font-size: 18px; color: var(--glow); }
      #boot.stuck .retry { display: block; }
      @keyframes boot-trot { to { background-position: -320px 0; } }
      @keyframes boot-twinkle { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .dog, #boot .stars i { animation: none; }
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- écran de chargement : Pixel trottine le long du chemin pendant que le jeu se prépare -->
    <div id="boot" aria-label="Chargement">
      <div class="stars"></div>
      <div class="stage">
        <p class="name">VESPER</p>
        <div class="path"><div class="lit"></div><div class="dog"></div></div>
        <p class="line"></p>
        <p class="retry">Touche l’écran pour réessayer</p>
      </div>
    </div>
    <script>
      (function () {
        var b = document.getElementById('boot'), t0 = performance.now(), p = 0, out = false;
        var az = false;
        try { az = localStorage.getItem('vesper.selected') === 'azura'; } catch (e) {}
        if (az) b.classList.add('az');
        var lines = az
          ? ['Les deux lunes se lèvent sur Azura…', 'La marée monte dans la ville blanche…', 'Pixel rêve d’un ciel turquoise…']
          : ['Pixel flaire le chemin…', 'Le soleil se couche sur Vesper…', 'Le vent soulève la poussière…'];
        b.querySelector('.line').textContent = lines[Math.floor(Math.random() * lines.length)];
        // quelques étoiles, placées au hasard
        var sky = b.querySelector('.stars');
        for (var i = 0; i < 26; i++) {
          var s = document.createElement('i');
          s.style.left = (Math.random() * 100).toFixed(1) + '%';
          s.style.top = (Math.random() * 62).toFixed(1) + '%';
          s.style.opacity = (0.25 + Math.random() * 0.6).toFixed(2);
          s.style.animationDelay = (-Math.random() * 2.4).toFixed(2) + 's';
          sky.appendChild(s);
        }
        function step(v) { if (v > p) { p = v; b.style.setProperty('--p', String(p)); } }
        window.__boot = {
          step: step,
          done: function () {
            if (out) return;
            out = true;
            step(1);
            // Pixel finit sa course, puis l'écran s'efface ; jamais moins d'une seconde, pour ne pas clignoter
            var wait = Math.max(650, 1150 - (performance.now() - t0));
            setTimeout(function () {
              b.classList.add('out');
              setTimeout(function () { b.remove(); }, 600);
            }, wait);
          },
        };
        step(0.12);
        document.addEventListener('DOMContentLoaded', function () { step(0.35); });
        if (document.fonts && document.fonts.load) document.fonts.load('20px VT323').then(function () { step(0.55); }, function () {});
        // si le jeu ne démarre pas (réseau coupé…), on propose de recharger
        setTimeout(function () {
          if (out) return;
          b.classList.add('stuck');
          b.addEventListener('click', function () { location.reload(); });
        }, 12000);
      })();
    </script>
    <main id="app">
      <div id="screen">
        <canvas id="game"></canvas>
        <div id="place"></div>
        <div id="toast"></div>
        <div id="detector" hidden><span class="name">SONDE</span><span class="bars"></span><span class="label"></span></div>
        <div id="dialog" hidden>
          <p id="dialog-text"></p>
          <span id="dialog-more" hidden>▼</span>
        </div>
        <div id="heat-banner" hidden></div>
        <div id="achievement" hidden></div>
        <div id="fade"></div>
      </div>

      <div id="controls">
        <div class="dpad">
          <button data-btn="up" class="d up" aria-label="Haut"></button>
          <button data-btn="left" class="d left" aria-label="Gauche"></button>
          <span class="d center"></span>
          <button data-btn="right" class="d right" aria-label="Droite"></button>
          <button data-btn="down" class="d down" aria-label="Bas"></button>
        </div>
        <div class="right">
          <div class="pills">
            <button data-btn="menu" id="btn-menu" class="pill" aria-label="Menu">☰<span class="lbl"> Menu</span></button>
            <button data-btn="bag" id="btn-bag" class="pill" aria-label="Sac">Sac</button>
            <button data-btn="journal" id="btn-journal" class="pill" aria-label="Journal">Journal</button>
          </div>
          <button data-btn="a" class="round a" aria-label="Examiner">A</button>
        </div>
      </div>

      <!-- écran titre -->
      <section id="title" class="overlay">
        <canvas id="title-bg" aria-hidden="true"></canvas>
        <div class="title-box title-layout">
          <div class="title-top">
            <p class="kicker" id="title-chap">Chapitre 1 · Le Réveil</p>
            <h1>VESPER</h1>
            <p class="tagline" id="title-tag"></p>
          </div>
          <div class="title-bottom">
            <button id="btn-play" class="menu primary play-btn"><span id="btn-play-label">Commencer</span><small id="btn-play-sub"></small></button>
            <button id="btn-buy" class="menu azura-buy buy-btn" hidden>Acheter le chapitre 2 · 0,99&nbsp;€</button>
            <button id="btn-new" class="menu new-btn" hidden>Nouvelle partie</button>
            <button id="btn-chapters" class="menu chapters-btn">Chapitres</button>
          </div>
        </div>
      </section>

      <!-- journal -->
      <section id="journal" class="overlay" hidden>
        <div class="journal-box">
          <header>
            <h2>Journal</h2>
            <button id="journal-close" class="close" aria-label="Fermer">✕</button>
          </header>
          <p id="journal-progress"></p>
          <div id="journal-body"></div>
        </div>
      </section>

      <!-- sac à dos -->
      <section id="bag" class="overlay" hidden>
        <div class="journal-box bag-box">
          <header>
            <h2>Sac à dos</h2>
            <button id="bag-close" class="close" aria-label="Fermer">✕</button>
          </header>
          <div id="bag-grid"></div>
          <div id="bag-detail"></div>
        </div>
      </section>

      <!-- récepteur radio -->
      <section id="radio" class="overlay" hidden>
        <div class="keypad-box radio-box">
          <h2>RÉCEPTEUR</h2>
          <p>Tourne la molette pour chercher un signal</p>
          <div class="radio-screen"><span id="radio-freq">40,0</span><small>MHz</small></div>
          <div id="radio-meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p id="radio-status">Bruit</p>
          <div class="radio-knobs">
            <button data-tune="-1" class="menu">◀◀</button>
            <button data-tune="-0.1" class="menu">◀</button>
            <button data-tune="0.1" class="menu">▶</button>
            <button data-tune="1" class="menu">▶▶</button>
          </div>
          <button id="radio-close" class="menu">Ranger le récepteur</button>
        </div>
      </section>

      <!-- visionneuse : carte des orbites, grille de décodage -->
      <section id="viewer" class="overlay" hidden>
        <div class="journal-box viewer-box">
          <header>
            <h2 id="viewer-title"></h2>
            <button id="viewer-close" class="close" aria-label="Fermer">✕</button>
          </header>
          <div id="viewer-body"></div>
        </div>
      </section>

      <!-- tableau d'interrupteurs -->
      <section id="switches" class="overlay" hidden>
        <div id="switches-box" class="keypad-box">
          <h2>DÉRIVATION</h2>
          <p>Centrale Hélios — circuits principaux</p>
          <div id="switches-grid"></div>
          <p id="switches-status"></p>
          <button id="switches-close" class="menu">Laisser le tableau</button>
        </div>
      </section>

      <!-- ordinateur des archives -->
      <section id="term" class="overlay" hidden>
        <div class="term-box"><div id="term-screen"></div></div>
      </section>

      <!-- souvenirs de Pixel -->
      <section id="memory" class="memory" hidden>
        <p id="memory-title"></p>
        <canvas id="memory-canvas"></canvas>
        <p id="memory-caption"></p>
        <p class="memory-hint">Touche pour continuer</p>
      </section>

      <!-- scène finale -->
      <section id="finale" class="finale" hidden>
        <canvas id="finale-canvas"></canvas>
        <p id="finale-text"></p>
      </section>

      <!-- clavier à code -->
      <section id="keypad" class="overlay" hidden>
        <div class="keypad-box">
          <h2 id="keypad-title">ACCÈS</h2>
          <p id="keypad-sub">Code de mission</p>
          <div id="keypad-digits">
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
          </div>
          <div class="row">
            <button id="keypad-cancel" class="menu">Annuler</button>
            <button id="keypad-ok" class="menu primary">Valider</button>
          </div>
        </div>
      </section>

      <!-- pause -->
      <section id="pause" class="overlay" hidden>
        <div class="title-box panel">
          <p class="kicker">Pause</p>
          <button id="pause-resume" class="menu primary">Reprendre</button>
          <button id="pause-sound" class="menu">Son : activé</button>
          <button id="pause-quit" class="menu">Sauvegarder et quitter</button>
          <p id="pause-status" class="status"></p>
        </div>
      </section>

      <!-- confirmation -->
      <section id="chapters" class="overlay" hidden>
        <div class="chapters-box panel">
          <header class="chapters-head"><h2>Chapitres</h2><button id="chapters-close" class="menu small">Fermer</button></header>
          <div id="chapters-list"></div>
        </div>
      </section>

      <section id="confirm" class="overlay" hidden>
        <div class="title-box panel">
          <p id="confirm-text" class="tagline"></p>
          <button id="confirm-yes" class="menu primary">Oui</button>
          <button id="confirm-no" class="menu">Non</button>
        </div>
      </section>

    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
