<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0812" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vesper" />
    <title>Vesper</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-180.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <div id="screen">
        <canvas id="game"></canvas>
        <div id="place"></div>
        <div id="toast"></div>
        <div id="detector" hidden><span class="name">SONDE</span><span class="bars"></span><span class="label"></span></div>
        <div id="dialog" hidden>
          <p id="dialog-text"></p>
          <span id="dialog-more" hidden>▼</span>
        </div>
        <div id="heat-banner" hidden></div>
        <div id="achievement" hidden></div>
        <div id="fade"></div>
      </div>

      <div id="controls">
        <div class="dpad">
          <button data-btn="up" class="d up" aria-label="Haut"></button>
          <button data-btn="left" class="d left" aria-label="Gauche"></button>
          <span class="d center"></span>
          <button data-btn="right" class="d right" aria-label="Droite"></button>
          <button data-btn="down" class="d down" aria-label="Bas"></button>
        </div>
        <div class="right">
          <div class="pills">
            <button data-btn="menu" id="btn-menu" class="pill" aria-label="Menu">☰<span class="lbl"> Menu</span></button>
            <button data-btn="bag" id="btn-bag" class="pill" aria-label="Sac">Sac</button>
            <button data-btn="journal" id="btn-journal" class="pill" aria-label="Journal">Journal</button>
          </div>
          <button data-btn="a" class="round a" aria-label="Examiner">A</button>
        </div>
      </div>

      <!-- écran titre -->
      <section id="title" class="overlay">
        <canvas id="title-bg" aria-hidden="true"></canvas>
        <div class="title-box title-layout">
          <div class="title-top">
            <h1>VESPER</h1>
            <p class="tagline">Un réveil.<br />Une planète.<br />Un chien qui n’oublie pas.</p>
          </div>
          <div class="title-bottom">
            <button id="btn-play" class="menu primary play-btn"><span id="btn-play-label">Commencer</span><small id="btn-play-sub"></small></button>
            <button id="btn-chapters" class="menu chapters-btn">Chapitres</button>
          </div>
        </div>
      </section>

      <!-- journal -->
      <section id="journal" class="overlay" hidden>
        <div class="journal-box">
          <header>
            <h2>Journal</h2>
            <button id="journal-close" class="close" aria-label="Fermer">✕</button>
          </header>
          <p id="journal-progress"></p>
          <div id="journal-body"></div>
        </div>
      </section>

      <!-- sac à dos -->
      <section id="bag" class="overlay" hidden>
        <div class="journal-box bag-box">
          <header>
            <h2>Sac à dos</h2>
            <button id="bag-close" class="close" aria-label="Fermer">✕</button>
          </header>
          <div id="bag-grid"></div>
          <div id="bag-detail"></div>
        </div>
      </section>

      <!-- récepteur radio -->
      <section id="radio" class="overlay" hidden>
        <div class="keypad-box radio-box">
          <h2>RÉCEPTEUR</h2>
          <p>Tourne la molette pour chercher un signal</p>
          <div class="radio-screen"><span id="radio-freq">40,0</span><small>MHz</small></div>
          <div id="radio-meter"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <p id="radio-status">Bruit</p>
          <div class="radio-knobs">
            <button data-tune="-1" class="menu">◀◀</button>
            <button data-tune="-0.1" class="menu">◀</button>
            <button data-tune="0.1" class="menu">▶</button>
            <button data-tune="1" class="menu">▶▶</button>
          </div>
          <button id="radio-close" class="menu">Ranger le récepteur</button>
        </div>
      </section>

      <!-- visionneuse : carte des orbites, grille de décodage -->
      <section id="viewer" class="overlay" hidden>
        <div class="journal-box viewer-box">
          <header>
            <h2 id="viewer-title"></h2>
            <button id="viewer-close" class="close" aria-label="Fermer">✕</button>
          </header>
          <div id="viewer-body"></div>
        </div>
      </section>

      <!-- tableau d'interrupteurs -->
      <section id="switches" class="overlay" hidden>
        <div id="switches-box" class="keypad-box">
          <h2>DÉRIVATION</h2>
          <p>Centrale Hélios — circuits principaux</p>
          <div id="switches-grid"></div>
          <p id="switches-status"></p>
          <button id="switches-close" class="menu">Laisser le tableau</button>
        </div>
      </section>

      <!-- ordinateur des archives -->
      <section id="term" class="overlay" hidden>
        <div class="term-box"><div id="term-screen"></div></div>
      </section>

      <!-- souvenirs de Pixel -->
      <section id="memory" class="memory" hidden>
        <p id="memory-title"></p>
        <canvas id="memory-canvas"></canvas>
        <p id="memory-caption"></p>
        <p class="memory-hint">Touche pour continuer</p>
      </section>

      <!-- scène finale -->
      <section id="finale" class="finale" hidden>
        <canvas id="finale-canvas"></canvas>
        <p id="finale-text"></p>
      </section>

      <!-- clavier à code -->
      <section id="keypad" class="overlay" hidden>
        <div class="keypad-box">
          <h2 id="keypad-title">ACCÈS</h2>
          <p id="keypad-sub">Code de mission</p>
          <div id="keypad-digits">
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
            <div class="digit"><button class="up">▲</button><span>0</span><button class="down">▼</button></div>
          </div>
          <div class="row">
            <button id="keypad-cancel" class="menu">Annuler</button>
            <button id="keypad-ok" class="menu primary">Valider</button>
          </div>
        </div>
      </section>

      <!-- pause -->
      <section id="pause" class="overlay" hidden>
        <div class="title-box panel">
          <p class="kicker">Pause</p>
          <button id="pause-resume" class="menu primary">Reprendre</button>
          <button id="pause-sound" class="menu">Son : activé</button>
          <button id="pause-quit" class="menu">Sauvegarder et quitter</button>
          <p id="pause-status" class="status"></p>
        </div>
      </section>

      <!-- confirmation -->
      <section id="chapters" class="overlay" hidden>
        <div class="chapters-box panel">
          <header class="chapters-head"><h2>Chapitres</h2><button id="chapters-close" class="menu small">Fermer</button></header>
          <div id="chapters-list"></div>
        </div>
      </section>

      <section id="confirm" class="overlay" hidden>
        <div class="title-box panel">
          <p id="confirm-text" class="tagline"></p>
          <button id="confirm-yes" class="menu primary">Oui</button>
          <button id="confirm-no" class="menu">Non</button>
        </div>
      </section>

    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
